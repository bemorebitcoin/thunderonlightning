<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌩️</text></svg>">
    <title>Thunder on the Lightning Network</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #6ac5f4; /* Powder Blue - Gulf GT40 base */
            color: #001f3f; /* Dark blue/navy for text */
        }
        header {
            background: linear-gradient(to right, #001f3f, #092b2b, #001f3f); /* Dark blue stripe feel */
            color: #ff671f; /* Orange text for impact */
            text-align: center;
            padding: 60px 20px;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

/* Target your page title — update selector if needed */
h1, .site-title, .page-title {
  font-size: 20vw;        /* desktop size */
  line-height: 1.1;
  font-weight: bold;       /* optional */
}

/* Mobile-friendly size */
@media (max-width: 768px) {
  h1, .site-title, .page-title {
    font-size: 48px;       /* smaller on phones */
  }
}

        
        h1, h2, h3 {
            margin: 0.5em 0;
            color: #ff671f; /* Marigold/Orange for headings */
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.92); /* Semi-transparent white for readability on blue bg */
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            margin-top: -40px; /* Overlap header slightly for dynamic feel */
        }
        .section {
            margin-bottom: 40px;
            padding: 25px;
            border-left: 8px solid #ff671f; /* Orange stripe on left like car livery */
            background: #f0f8ff; /* Very light blue tint */
            border-radius: 8px;
        }
        ul {
            list-style-type: none;
            padding-left: 0;
        }
        ul li {
            margin-bottom: 12px;
            position: relative;
            padding-left: 30px;
        }
        ul li::before {
            content: "→";
            color: #ff671f;
            position: absolute;
            left: 0;
            font-weight: bold;
        }
        .highlight {
            background: #ff671f;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: #001f3f;
            font-size: 0.9em;
            margin-top: 40px;
        }

<!-- favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg">

    </style>

    </header>.

    <footer>

</body>
</html>
